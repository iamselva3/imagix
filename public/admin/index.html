<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0b0b0c"><link rel="icon" href="/assets/logo-icon.svg" type="image/svg+xml"><link rel="stylesheet" href="/assets/admin.css"><title>Imagix Studio — Admin</title></head>
<body><header><a href="/" class="admin-brand"><img src="/assets/logo-lockup-light.svg" alt="Imagix Photography"></a><span>STUDIO ADMIN</span></header><main><section class="login" id="login-panel"><p class="eyebrow">PRIVATE STUDIO</p><h1>Good to have <em>you back.</em></h1><p>Sign in to manage the Imagix gallery.</p><form id="login-form"><label>Admin password<input name="password" type="password" autocomplete="current-password" required></label><button>Sign in <b>↗</b></button><p class="status" id="login-status" role="status"></p></form></section>
<section class="dashboard" id="dashboard" hidden><div class="dash-heading"><div><p class="eyebrow">THE IMAGE LIBRARY</p><h1>Keep it <em>current.</em></h1></div><button class="quiet" id="logout">Sign out</button></div><section class="upload-box" id="drop-zone"><div class="upload-icon">＋</div><h2>Add photographs</h2><p>Drop image files here or choose from your device.<br>Images are resized to WebP before upload.</p><label class="choose-files">Choose images<input id="file-input" type="file" accept="image/*" multiple hidden></label><p class="status" id="upload-status" role="status"></p><div class="upload-progress" id="upload-progress" hidden><i></i></div></section><div class="library-head"><h2>Your gallery <span id="photo-count">0</span></h2><button class="quiet" id="refresh">Refresh ↻</button></div><div class="photo-list" id="photo-list"></div></section></main><script type="module" src="/assets/admin.js"></script></body></html>
