<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" fill="none" class="imagix-splash-logo">
  <defs>
    <!-- Rich Metallic Gold Gradient -->
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CA9E56" />
      <stop offset="25%" stop-color="#FDE8B3" />
      <stop offset="45%" stop-color="#E5BE75" />
      <stop offset="70%" stop-color="#9E712F" />
      <stop offset="90%" stop-color="#F5DC9E" />
      <stop offset="100%" stop-color="#BD8F42" />
    </linearGradient>

    <!-- Chrome / Silver Accent for Depth -->
    <linearGradient id="goldSilver" x1="0%" y1="30%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#EED6A2" />
      <stop offset="35%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#D9B26B" />
      <stop offset="100%" stop-color="#8C6322" />
    </linearGradient>

    <!-- Lens Center Radial Glow -->
    <radialGradient id="lensGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A1815" />
      <stop offset="75%" stop-color="#0B0A09" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- Flare Glint -->
    <radialGradient id="glint" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="40%" stop-color="#FFE8B0" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#D4A759" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- CAMERA OUTLINE AROUND "I" & PART OF "M" -->
  <g class="logo-camera-outline">
    <!-- Camera Top Shutter Button -->
    <rect x="98" y="55" width="34" height="8" rx="2" fill="url(#goldMetallic)" stroke="url(#goldMetallic)" stroke-width="1.5" />
    
    <!-- Camera Body Outline Path -->
    <path class="camera-body-stroke"
      d="M 64 165
         L 64 78
         Q 64 68 76 68
         L 138 68
         Q 146 68 152 60
         L 165 42
         Q 172 34 186 34
         L 230 34
         Q 244 34 251 42
         L 264 60
         Q 270 68 278 68
         L 294 68
         Q 302 68 302 76
         L 302 96"
      fill="none"
      stroke="url(#goldMetallic)"
      stroke-width="5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- TYPOGRAPHY "IMAGIX" -->
  <g class="logo-letters" fill="url(#goldSilver)">
    <!-- Letter I (framed inside camera) -->
    <g class="letter-i">
      <!-- Top Serif -->
      <path d="M 88 88 L 136 88 L 136 96 L 118 96 L 118 156 L 136 156 L 136 164 L 88 164 L 88 156 L 106 156 L 106 96 L 88 96 Z" />
    </g>

    <!-- Letter M -->
    <g class="letter-m">
      <path d="M 146 88 L 168 88 L 198 142 L 228 88 L 250 88 L 250 164 L 235 164 L 235 106 L 205 158 L 191 158 L 161 106 L 161 164 L 146 164 Z" />
    </g>

    <!-- Letter A -->
    <g class="letter-a">
      <path d="M 282 88 L 302 88 L 332 164 L 314 164 L 306 144 L 278 144 L 270 164 L 252 164 Z M 283 131 L 301 131 L 292 106 Z" />
    </g>

    <!-- Letter G with APERTURE LENS INTEGRATION -->
    <g class="letter-g">
      <!-- Outer G Body Arc -->
      <path d="M 402 100
               C 388 88 368 85 350 90
               C 330 96 316 114 316 136
               C 316 156 330 172 352 176
               C 374 180 398 170 408 150
               L 408 132
               L 368 132
               L 368 122
               L 420 122
               L 420 156
               C 406 178 378 190 350 188
               C 320 186 298 164 298 136
               C 298 108 318 84 348 78
               C 372 74 398 80 414 96 Z"
      />
    </g>
  </g>

  <!-- APERTURE INSIDE G -->
  <g class="logo-aperture" transform="translate(362, 134)">
    <!-- Shutter Inner Circle Bed -->
    <circle cx="0" cy="0" r="28" fill="url(#lensGlow)" stroke="url(#goldMetallic)" stroke-width="2" />
    
    <!-- Aperture Blades -->
    <g stroke="url(#goldMetallic)" stroke-width="1.8" fill="none">
      <path d="M 0 -26 L 16 -6 L 8 6 L -8 -6 Z" fill="url(#goldMetallic)" fill-opacity="0.85" />
      <path d="M 22 -12 L 20 12 L 6 14 L 8 -10 Z" fill="url(#goldMetallic)" fill-opacity="0.9" />
      <path d="M 22 14 L 0 24 L -8 14 L 14 4 Z" fill="url(#goldMetallic)" fill-opacity="0.8" />
      <path d="M -2 25 L -22 12 L -14 0 L 6 12 Z" fill="url(#goldMetallic)" fill-opacity="0.88" />
      <path d="M -24 8 L -20 -16 L -6 -14 L -10 10 Z" fill="url(#goldMetallic)" fill-opacity="0.92" />
      <path d="M -16 -20 L 8 -24 L 14 -10 L -10 -6 Z" fill="url(#goldMetallic)" fill-opacity="0.85" />
    </g>
    <!-- Lens Center Core -->
    <circle cx="0" cy="0" r="9" fill="#000000" stroke="url(#goldMetallic)" stroke-width="1.2" />

    <!-- Glint Sparkle at Corner of Shutter -->
    <circle cx="16" cy="-4" r="8" fill="url(#glint)" class="aperture-glint" />
    <path d="M 16 -12 L 16 4 M 8 -4 L 24 -4" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- LETTERS I and X (with Upper Right Swoosh) -->
  <g class="logo-letters" fill="url(#goldSilver)">
    <!-- Second Letter I -->
    <g class="letter-i2">
      <path d="M 430 88 L 460 88 L 460 96 L 450 96 L 450 156 L 460 156 L 460 164 L 430 164 L 430 156 L 440 156 L 440 96 L 430 96 Z" />
    </g>

    <!-- Letter X with Upper-Right SWOOSH -->
    <g class="letter-x">
      <!-- Main downward right stroke -->
      <path d="M 470 88 L 492 88 L 526 136 L 560 164 L 540 164 L 512 142 L 484 164 L 464 164 L 500 126 Z" />
      
      <!-- Upward Right Stroke that curves into the dramatic SWOOSH -->
      <path class="x-swoosh"
        d="M 494 164
           L 508 144
           L 538 98
           Q 560 62 615 44
           C 630 38 644 34 656 32
           C 628 42 590 66 565 106
           L 528 152
           L 520 164 Z"
      />
    </g>
  </g>

  <!-- SUBTITLE: · PHOTOGRAPHY · centered directly at the bottom of IMAGIX -->
  <g class="logo-subline">
    <!-- Left Diamond Glint -->
    <g transform="translate(214, 209)">
      <path d="M 0 -3.5 L 2.8 0 L 0 3.5 L -2.8 0 Z" fill="url(#goldMetallic)" />
      <circle cx="0" cy="0" r="1.1" fill="#FFFFFF" opacity="0.95" />
    </g>

    <!-- Center Word -->
    <text x="324" y="214"
          fill="url(#goldMetallic)"
          font-family="'Inter Tight', 'DM Sans', -apple-system, sans-serif"
          font-size="12"
          font-weight="700"
          letter-spacing="8"
          text-anchor="middle">
      PHOTOGRAPHY
    </text>

    <!-- Right Diamond Glint -->
    <g transform="translate(434, 209)">
      <path d="M 0 -3.5 L 2.8 0 L 0 3.5 L -2.8 0 Z" fill="url(#goldMetallic)" />
      <circle cx="0" cy="0" r="1.1" fill="#FFFFFF" opacity="0.95" />
    </g>
  </g>
</svg>
