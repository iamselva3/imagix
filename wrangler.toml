name = "imagix-photography"
main = "src/index.js"
compatibility_date = "2026-09-01"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*", "/media/*"]

[[kv_namespaces]]
binding = "IMAGIX_META"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[[r2_buckets]]
binding = "IMAGIX_PHOTOS"
bucket_name = "imagix-photography-images"

[vars]
WHATSAPP_NUMBER = ""
ALLOWED_ORIGIN = "http://localhost:8787"
