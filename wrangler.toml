name = "imagix-photography"
main = "src/index.js"
compatibility_date = "2026-09-01"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*", "/media/*"]

[vars]
WHATSAPP_NUMBER = "+919047055747"
ALLOWED_ORIGIN = "*"

# -----------------------------------------------------------------------------
# Optional: Dynamic Cloudflare KV & R2 Storage Bindings
# To enable dynamic admin photo uploads via Cloudflare storage:
# 1. Create a KV namespace:  npx wrangler kv namespace create IMAGIX_META
# 2. Create an R2 bucket:    npx wrangler r2 bucket create imagix-photography-images
# 3. Paste your real KV id below (or configure via Cloudflare Dashboard -> Settings -> Bindings):
#
# [[kv_namespaces]]
# binding = "IMAGIX_META"
# id = "YOUR_REAL_KV_NAMESPACE_ID"
#
# [[r2_buckets]]
# binding = "IMAGIX_PHOTOS"
# bucket_name = "imagix-photography-images"
# -----------------------------------------------------------------------------
