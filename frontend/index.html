<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Fine art wedding, portrait, and celebration photography by Imagix Photography in Tamil Nadu, India. Candid, cinematic, and timeless heirloom stories." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Imagix Photography — Moments today. Memories forever." />
    <meta property="og:description" content="Fine art wedding and portrait photography by Imagix Photography in Tamil Nadu, India." />
    <meta property="og:image" content="/assets/logo-icon-512.png" />
    <meta property="og:type" content="website" />
    <link rel="icon" href="/assets/logo-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/assets/logo-icon-512.png" />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Allura&family=Anton&family=Archivo+Black&family=Caveat:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&family=Great+Vibes&family=Inter+Tight:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet" />
    <script>
      // Admin-selected fonts: re-apply the last known choice before first paint
      // (kept fresh by src/lib/typography.js) so there is no default-font flash.
      (function () {
        try {
          var cached = JSON.parse(localStorage.getItem('imagix-typography-v1') || 'null');
          if (!cached || !cached.vars) return;
          var allowed = { '--font-heading': 1, '--font-body': 1, '--font-display': 1, '--font-script': 1 };
          for (var key in cached.vars) {
            if (allowed[key] && typeof cached.vars[key] === 'string') {
              document.documentElement.style.setProperty(key, cached.vars[key]);
            }
          }
          if (typeof cached.href === 'string' && cached.href.indexOf('https://fonts.googleapis.com/css2?') === 0) {
            var link = document.createElement('link');
            link.id = 'imagix-runtime-fonts';
            link.rel = 'stylesheet';
            link.href = cached.href;
            document.head.appendChild(link);
          }
        } catch (e) {}
      })();
    </script>
    <title>Imagix Photography — Moments today. Memories forever.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
